services:
  - type: web
    name: vnr-campus-connect
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run render:build
    startCommand: npm run render:start
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: vnr-campus-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: vnr-campus-db
    plan: free
    databaseName: wimp
    user: wimp
