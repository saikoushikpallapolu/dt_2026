name: Render Production Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: render-production
  cancel-in-progress: true

jobs:
  production:
    if: github.ref == 'refs/heads/main'
    name: Verify production on Render
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: Production
      url: https://dt-2026.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check deployment verifier
        run: node --test scripts/verify-render-deployment.test.mjs
      - name: Wait for this commit and verify the live app
        env:
          APP_URL: https://dt-2026.onrender.com
          EXPECTED_COMMIT: ${{ github.sha }}
        run: node scripts/verify-render-deployment.mjs
